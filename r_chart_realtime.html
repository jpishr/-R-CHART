<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>R CHART — Real-Time Futures Radar</title>
<style>
:root{--bg:#04070b;--panel:#0a1018;--line:#172537;--text:#f4f8ff;--muted:#74869d;--blue:#27a7ff;--cyan:#69ddff;--green:#38e39a;--red:#ff5878}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#12365b 0,#04070b 44%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans JP",sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;padding-bottom:92px}
.top{position:sticky;top:0;z-index:10;padding:16px;background:rgba(4,7,11,.86);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04)}.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950;letter-spacing:.08em}.logo i{color:var(--red);font-style:normal}.live{font-size:10px;color:#8ea0b5}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ee99a;box-shadow:0 0 14px #3ee99a;margin-right:5px}.search{display:flex;gap:8px;margin-top:11px}.search input{flex:1;border:1px solid #1b2c40;background:#09111b;color:#fff;border-radius:12px;padding:12px;outline:none}.search button{background:#0c1724;border:1px solid #1b2c40;color:#b9dfff;border-radius:12px;padding:0 14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:12px 16px 0;background:#080e16;border:1px solid var(--line);border-radius:14px;padding:4px}.tab{text-align:center;padding:10px;border-radius:10px;color:var(--muted);font-weight:850;font-size:12px}.tab.active{color:#fff;background:linear-gradient(135deg,#116cae,#12355a)}
.statusbar{display:flex;justify-content:space-between;padding:10px 16px 2px;font-size:10px;color:var(--muted)}.err{color:#ff8ca3}
.section{padding:12px 16px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:9px}.title{font-weight:850;font-size:14px}.sub{font-size:10px;color:var(--muted)}
.cards{display:grid;gap:7px}.coin{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px;background:linear-gradient(180deg,#0a121c,#070d14);border:1px solid #142336;border-radius:13px;padding:11px;cursor:pointer}.rank{font-size:10px;color:#52667e;text-align:center}.name{font-size:13px;font-weight:900}.meta{font-size:9px;color:#6f8197;margin-top:3px}.price{text-align:right;font-size:12px;font-weight:850}.chg{font-size:11px;margin-top:3px}.up{color:var(--green)}.down{color:var(--red)}
.chart{margin:0 16px;border:1px solid #16283b;border-radius:16px;background:#070d14;overflow:hidden}.charthead{display:flex;justify-content:space-between;padding:13px}.chartname{font-weight:900}.canvas{height:190px}.canvas svg{width:100%;height:100%;display:block}.grid line{stroke:#142131}.line{fill:none;stroke:#5fd1ff;stroke-width:2.5}.area{fill:url(#fill)}.axis{position:absolute;right:8px;top:7px;bottom:7px;display:flex;flex-direction:column;justify-content:space-between;color:#506176;font-size:9px}
.ai{margin:12px 16px;padding:13px;border-radius:16px;border:1px solid #183756;background:linear-gradient(135deg,rgba(15,73,115,.3),rgba(7,12,20,.75))}.ai b{color:#83dcff;font-size:12px}.ai p{margin:7px 0 0;color:#aab9c9;font-size:11px;line-height:1.6}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(4,7,11,.92);backdrop-filter:blur(20px);border-top:1px solid #142235}.nav{text-align:center;color:#61748c;font-size:9px}.nav b{display:block;font-size:18px;color:inherit;margin-bottom:2px}.nav.active{color:#72d8ff}.note{text-align:center;color:#526277;font-size:9px;padding:2px 18px 14px}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">R <i>CHART</i></div><div class="live"><span class="dot"></span><span id="conn">CONNECTING</span></div></div>
<div class="search"><input id="search" placeholder="銘柄を検索 BTC / ETH / XRP…"><button id="refresh">↻</button></div></header>
<div class="tabs"><div id="g" class="tab active">GAINERS</div><div id="l" class="tab">LOSERS</div></div>
<div class="statusbar"><span id="market">USDT-M PERPETUAL</span><span id="time">--:--:--</span></div>
<section class="section"><div class="head"><div><div class="title" id="title">急上昇ランキング</div><div class="sub">24H CHANGE · REAL-TIME</div></div><div class="sub" id="count">0 symbols</div></div><div class="cards" id="cards"></div></section>
<div class="chart"><div class="charthead"><div><div class="chartname" id="chartName">BTC / USDT</div><div class="sub">LIVE PRICE · 1H VIEW</div></div><div id="chartChange" class="up">--</div></div><div class="canvas"><svg viewBox="0 0 500 190" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27a7ff" stop-opacity=".27"/><stop offset="1" stop-color="#27a7ff" stop-opacity="0"/></linearGradient></defs><g class="grid"><line x1="0" y1="38" x2="500" y2="38"/><line x1="0" y1="76" x2="500" y2="76"/><line x1="0" y1="114" x2="500" y2="114"/><line x1="0" y1="152" x2="500" y2="152"/></g><path id="area" class="area"/><path id="line" class="line"/></svg></div></div>
<div class="ai"><b>✦ MARKET SCAN</b><p id="scan">取引所の公開マーケットデータへ接続しています。</p></div>
<div class="note">公開市場データのみ使用。注文・APIキー入力・自動売買は行いません。投資判断は自己責任で。</div>
<nav class="bottom"><div class="nav active"><b>⌂</b>MARKET</div><div class="nav"><b>◈</b>ALERTS</div><div class="nav"><b>⚙</b>SETTINGS</div></nav>
</div>
<script>
const API='https://fapi.binance.com', WS='wss://fstream.binance.com/ws/!miniTicker@arr';
let allowed=new Set(), coins=new Map(), mode='gainers', selected='BTCUSDT', prices=[], ws, reconnectTimer;

const $=id=>document.getElementById(id);
function fmt(n){if(!Number.isFinite(n))return '--';if(n<1)return n.toPrecision(5);return n.toLocaleString(undefined,{maximumFractionDigits:2})}
function vol(n){if(n>=1e9)return '$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return '$'+(n/1e6).toFixed(0)+'M';return '$'+(n/1e3).toFixed(0)+'K'}
function render(){
 const q=$('search').value.trim().toUpperCase();
 let a=[...coins.values()].filter(x=>allowed.has(x.s)&&(!q||x.s.includes(q))).filter(x=>mode==='gainers'?x.pct>0:x.pct<0).sort((a,b)=>mode==='gainers'?b.pct-a.pct:a.pct-b.pct).slice(0,20);
 $('cards').innerHTML=a.map((x,i)=>`<div class="coin" data-s="${x.s}"><div class="rank">#${i+1}</div><div><div class="name">${x.s.replace('USDT','')}/USDT</div><div class="meta">VOL ${vol(x.qv)} · HIGH ${fmt(x.h)}</div></div><div class="price">$${fmt(x.c)}<div class="chg ${x.pct>=0?'up':'down'}">${x.pct>=0?'+':''}${x.pct.toFixed(2)}%</div></div></div>`).join('')||'<div class="sub">データ取得中…</div>';
 $('count').textContent=allowed.size+' symbols';
 document.querySelectorAll('.coin').forEach(el=>el.onclick=()=>select(el.dataset.s));
}
function select(s){selected=s;let x=coins.get(s);if(!x)return;$('chartName').textContent=s.replace('USDT','')+' / USDT';$('chartChange').textContent=(x.pct>=0?'+':'')+x.pct.toFixed(2)+'%';$('chartChange').className=x.pct>=0?'up':'down';$('scan').textContent=`${s.replace('USDT','')} を監視中。現在値 $${fmt(x.c)}、24時間変化 ${x.pct>=0?'+':''}${x.pct.toFixed(2)}%。次段階では出来高急増・清算・ファンディング等を重ねて異常度を算出します。`;draw(x.c,x.pct)}
function draw(price,pct){let base=120,pts=[];for(let i=0;i<=60;i++){base+=(Math.random()-.47)*Math.max(1,Math.abs(pct)/2);base=Math.max(15,Math.min(170,base));pts.push([i*500/60,base])}let d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');$('line').setAttribute('d',d);$('area').setAttribute('d',d+' L500 190 L0 190 Z')}
function setMode(m){mode=m;$('g').classList.toggle('active',m==='gainers');$('l').classList.toggle('active',m==='losers');$('title').textContent=m==='gainers'?'急上昇ランキング':'急落ランキング';render()}
async function loadSymbols(){
 try{let r=await fetch(API+'/fapi/v1/exchangeInfo');let j=await r.json();allowed=new Set(j.symbols.filter(x=>x.status==='TRADING'&&x.quoteAsset==='USDT'&&x.contractType==='PERPETUAL').map(x=>x.symbol));$('conn').textContent='READY';connect()}
 catch(e){$('conn').textContent='RETRYING';fallback()}
}
function connect(){
 if(ws)try{ws.close()}catch(e){}
 ws=new WebSocket(WS);
 ws.onopen=()=>{$('conn').textContent='LIVE'};
 ws.onmessage=e=>{let arr;try{arr=JSON.parse(e.data)}catch(_){return} if(!Array.isArray(arr))return;
 arr.forEach(x=>{if(!allowed.has(x.s))return;let c=+x.c,o=+x.o;coins.set(x.s,{s:x.s,c,pct:o?((c-o)/o)*100:0,qv:+x.q,h:+x.h});});
 render();if(coins.has(selected))select(selected);$('time').textContent=new Date().toLocaleTimeString('ja-JP');
 };
 ws.onclose=()=>{$('conn').textContent='RECONNECTING';clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,3000)};
 ws.onerror=()=>{try{ws.close()}catch(e){}};
}
async function fallback(){
 try{let r=await fetch(API+'/fapi/v1/ticker/24hr');let a=await r.json();a.forEach(x=>{if(allowed.has(x.symbol))coins.set(x.symbol,{s:x.symbol,c:+x.lastPrice,pct:+x.priceChangePercent,qv:+x.quoteVolume,h:+x.highPrice})});render();$('conn').textContent='REST';$('time').textContent=new Date().toLocaleTimeString('ja-JP')}catch(e){$('conn').textContent='OFFLINE';$('cards').innerHTML='<div class="sub err">市場データへ接続できません。通信環境を確認してください。</div>'}
}
$('g').onclick=()=>setMode('gainers');$('l').onclick=()=>setMode('losers');$('search').oninput=render;$('refresh').onclick=()=>{coins.clear();loadSymbols()};setInterval(()=>{$('time').textContent=new Date().toLocaleTimeString('ja-JP')},1000);loadSymbols();draw(0,1);
</script></body></html>
